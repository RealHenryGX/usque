name: Build (all arches)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish artifacts to (empty = no release)'
        required: false
        default: ''

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: "0.15.2"
  MUSL_MIRRORS: "https://musl.cc.timfish.dev https://musl.cc"

jobs:
  verify:
    name: verify (vet + test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Toolchain / module state
        run: |
          go version
          head -5 go.mod
          go mod verify
          go mod download

      - run: go vet ./...
      - run: go test ./...

  build:
    name: linux/${{ matrix.goarch }}${{ matrix.goarm }}
    runs-on: ubuntu-24.04
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # goarch / goarm / zig musl target / musl.cc triplet (zig wins when set)
          - { goarch: amd64,    goarm: "",  zig: x86_64-linux-musl,      muslcc: "" }
          - { goarch: "386",    goarm: "",  zig: x86-linux-musl,         muslcc: "" }
          - { goarch: arm64,    goarm: "",  zig: aarch64-linux-musl,     muslcc: "" }
          - { goarch: arm,      goarm: "6", zig: arm-linux-musleabihf,   muslcc: "" }
          - { goarch: arm,      goarm: "7", zig: arm-linux-musleabihf,   muslcc: "" }
          - { goarch: riscv64,  goarm: "",  zig: riscv64-linux-musl,     muslcc: "" }
          - { goarch: ppc64le,  goarm: "",  zig: powerpc64le-linux-musl, muslcc: "" }
          - { goarch: s390x,    goarm: "",  zig: s390x-linux-musl,       muslcc: "" }
          - { goarch: loong64,  goarm: "",  zig: loongarch64-linux-musl, muslcc: "" }
          # zig ships no musl headers for the mips family -> musl.cc gcc toolchains
          - { goarch: mips,     goarm: "",  zig: "", muslcc: mips-linux-musl }
          - { goarch: mipsle,   goarm: "",  zig: "", muslcc: mipsel-linux-musl }
          - { goarch: mips64,   goarm: "",  zig: "", muslcc: mips64-linux-musl }
          - { goarch: mips64le, goarm: "",  zig: "", muslcc: mips64el-linux-musl }

    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build metadata
        run: |
          # --match keeps the rolling 'latest' release tag out of the version string
          VERSION=$(git describe --tags --match 'v[0-9]*' --always --dirty 2>/dev/null || echo dev)
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ARCH="${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}"
          {
            echo "VERSION=$VERSION"
            echo "COMMIT=$COMMIT"
            echo "DATE=$DATE"
            echo "ARCH=$ARCH"
            echo "LDFLAGS=-s -w -X github.com/Diniboy1123/usque/cmd.version=$VERSION -X github.com/Diniboy1123/usque/cmd.commit=$COMMIT -X github.com/Diniboy1123/usque/cmd.date=$DATE"
          } >> "$GITHUB_ENV"

      - name: Install zig
        if: matrix.zig != ''
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -o /tmp/zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          sudo tar xf /tmp/zig.tar.xz -C /opt
          sudo ln -sf "/opt/zig-x86_64-linux-${ZIG_VERSION}/zig" /usr/local/bin/zig
          zig version

      - name: Install musl cross toolchain
        if: matrix.muslcc != ''
        run: |
          T="${{ matrix.muslcc }}"
          ok=""
          for base in $MUSL_MIRRORS; do
            echo "trying $base"
            if curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 600 \
                -o /tmp/musl.tgz "$base/$T-cross.tgz"; then
              sudo tar xzf /tmp/musl.tgz -C /opt && ok=1 && break
            fi
          done
          test -n "$ok" || { echo "::error::all musl mirrors failed"; exit 1; }
          test -x "/opt/$T-cross/bin/$T-gcc"
          "/opt/$T-cross/bin/$T-gcc" --version | head -1

      - name: Build
        run: |
          mkdir -p dist
          # 1) pure Go: no libc at all, runs on glibc and musl systems alike
          CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" \
            -o "dist/usque_${VERSION}_linux_${ARCH}" .
          # 2) musl: cgo, statically linked against musl libc
          MUSL_OUT="dist/usque_${VERSION}_linux_${ARCH}-musl"
          if [ -n "${{ matrix.zig }}" ]; then
            CGO_ENABLED=1 CC="zig cc -target ${{ matrix.zig }}" \
              go build -trimpath -ldflags "$LDFLAGS -linkmode external -extldflags -static" -o "$MUSL_OUT" .
            strip "$MUSL_OUT" 2>/dev/null || true
          else
            T="${{ matrix.muslcc }}"
            CGO_ENABLED=1 CC="/opt/$T-cross/bin/$T-gcc" CGO_LDFLAGS="-static" \
              go build -trimpath -ldflags "$LDFLAGS -linkmode external -extldflags -static" -o "$MUSL_OUT" .
            "/opt/$T-cross/bin/$T-strip" "$MUSL_OUT" 2>/dev/null || true
          fi
          ls -l dist

      - name: Assert both binaries are static
        run: |
          set -e
          for f in dist/*; do
            file -b "$f"
            if file -b "$f" | grep -qi 'dynamically linked'; then
              echo "::error::$f is dynamically linked"; exit 1
            fi
            test -s "$f"
          done

      - name: Upload per-arch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: usque-linux-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum usque_* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Resolve release tag
        id: tag
        run: |
          TAGGED="${{ startsWith(github.ref, 'refs/tags/') }}"
          if [ "$TAGGED" = "true" ]; then
            TAG="${{ github.ref_name }}"; PRE=false
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"; PRE=false
          else
            TAG="latest"; PRE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "publishing tag=$TAG prerelease=$PRE"

      - name: Prune stale assets on the target release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null |
            while read -r a; do
              [ -n "$a" ] || continue
              echo "removing $a"
              gh release delete-asset "$TAG" "$a" --repo "$GITHUB_REPOSITORY" -y || true
            done

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          make_latest: ${{ steps.tag.outputs.prerelease == 'false' }}
          fail_on_unmatched_files: true
          body: |
            Built from ${{ github.sha }} (${{ github.event_name }}).
            Run: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}>
          files: dist/*
